{{ define "main" }}

<article class="blog-post">

    <header>

        <h1>{{ .Title }}</h1>

        <time datetime="{{ .Date.Format `2006-01-02` }}">
            {{ .Date.Format "2 January 2006" }}
        </time>


    </header>

    <div class="article-content">
        {{ .Content }}
    </div>

    <footer>
		{{ with .GetTerms "tags" }}
			<p class="post-tags">
				<strong>tags : : </strong>
				<i>
				{{ range $i, $tag := . }}
					{{- if $i }}, {{ end -}}
					<a href="{{ $tag.RelPermalink }}">
						{{- $tag.LinkTitle -}}
					</a>
				{{ end }}
				</i>
			</p>
		{{ end }}
    </footer>

</article>

{{ end }}
